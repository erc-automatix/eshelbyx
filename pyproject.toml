[project]
name = "eshelbyx"
version = "0.0.1"
description = "Homogenization of heterogeneous materials in JAX"
readme = "README.md"
authors = [
    { name = "Jeremy Bleyer", email = "jeremy.bleyer@enpc.fr" },
    {name = "Martin Dolbeau", email = "martin.dolbeau@ensam.fr"}
]
license = { text = "GNU LGPLv2.1" }  # Replace or remove if not using MIT
keywords = ["material science", "material modeling", "solid mechanics", "homogenization", "FFT", "automatic differentiation"]
requires-python = ">=3.10"
dependencies = [
    "jaxmat>=0.0.3",
    "jax>=0.6.1",
    "equinox",
    "diffrax",
    "optimistix",
    "lineax",
    "pyvista"
]

[project.optional-dependencies]
gpu = [
    "jax[cuda12]>=0.6.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
